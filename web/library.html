<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기보 보관함</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --ink: #24211c;
    --muted: #7a7266;
    --line: #e2dccf;
    --wood: #dcb36b;
    --wood-line: #3b2c14;
    --accent: #2f6f5e;
    --danger: #a3402f;
    /* 차트 색: dataviz 검증 통과 (밝은 배경 대비·채도·색약 구분) */
    --series: #1a7f5a;
    --turning: #c2410c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }
  nav.top {
    max-width: 1180px; margin: 0 auto; padding: 14px 16px 0;
    display: flex; gap: 16px; font-size: 14px;
  }
  nav.top a { color: var(--muted); text-decoration: none; }
  nav.top a.on { color: var(--ink); font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }

  /* 목록 */
  h1 { font-size: 20px; margin: 4px 0 16px; }
  h2.section { font-size: 13px; color: var(--muted); font-weight: 600; margin: 20px 0 8px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .game-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .game-card:hover { border-color: var(--accent); }
  .game-card .title { font-weight: 600; }
  .game-card .players { font-size: 14px; margin-top: 2px; }
  .game-card .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { color: var(--muted); font-size: 14px; }

  /* 감상 */
  .viewer { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .viewer { grid-template-columns: 1fr; } }
  svg.board {
    width: 100%; max-height: calc(100vh - 140px); aspect-ratio: 1; display: block;
    border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(60,40,10,.15);
  }
  aside { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .game-title { font-size: 17px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); }
  .nav-row { display: flex; gap: 6px; align-items: center; }
  button {
    font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; }
  .move-no { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 14px; }
  input[type=range] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-top: 6px; }
  .kv span:first-child { color: var(--muted); white-space: nowrap; }
  .kv b { font-variant-numeric: tabular-nums; text-align: right; }
  .comment { font-size: 13px; white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: 8px 10px; margin-top: 8px; max-height: 140px; overflow: auto; }
  .reason { font-size: 13px; margin-top: 8px; }
  .pv { font-size: 12px; color: var(--muted); margin-top: 4px; cursor: default; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  /* 승률 그래프 */
  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: 150px; display: block; cursor: pointer; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px;
    padding: 4px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%);
  }
  .key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .key i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; vertical-align: middle; }
  .moments { display: grid; gap: 6px; }
  .moment {
    font-size: 13px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 6px 8px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: start;
  }
  .moment:hover { border-color: var(--accent); }
  .moment i { width: 8px; height: 8px; margin-top: 6px; }
  .dot { border-radius: 50%; background: var(--turning); }
  .diamond { background: var(--series); transform: rotate(45deg); }
</style>
</head>
<body>
<nav class="top">
  <a href="/">대국</a>
  <a href="/library" class="on">기보 보관함</a>
</nav>
<main>
  <section id="list-view">
    <h1>기보 보관함</h1>
    <h2 class="section">명국</h2>
    <div class="games" id="famous"></div>
    <h2 class="section">내 대국</h2>
    <div class="games" id="mine"></div>
  </section>

  <section id="viewer" class="viewer" hidden>
    <div><svg class="board" id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside>
      <div class="card">
        <div class="game-title" id="g-title"></div>
        <div class="sub" id="g-players"></div>
        <div class="sub" id="g-meta"></div>
        <div class="sub" id="g-warning" style="color: var(--danger)"></div>
      </div>

      <div class="card">
        <div class="nav-row">
          <button id="first" title="처음 (Home)">⏮</button>
          <button id="prev" title="이전 (←)">◀</button>
          <button id="next" title="다음 (→)">▶</button>
          <button id="last" title="끝 (End)">⏭</button>
          <span class="move-no" id="move-no"></span>
        </div>
        <input type="range" id="slider" min="0" value="0">
        <div class="comment" id="comment" hidden></div>
      </div>

      <div class="card">
        <h3>KataGo 분석</h3>
        <div id="analysis-start">
          <div class="sub" style="margin-bottom: 8px">모든 국면을 분석해 승률 그래프, 결정적 수, 수마다 근거를 보여줍니다. 19줄 기준 1~2분 걸립니다.</div>
          <button class="primary" id="analyze">분석 시작</button>
        </div>
        <div id="analysis-progress" hidden>
          <div class="sub" id="progress-text"></div>
          <div class="progress"><div id="progress-bar"></div></div>
        </div>
        <div id="analysis-body" hidden>
          <div class="chart-wrap">
            <svg class="chart" id="chart" aria-label="흑 승률 그래프"></svg>
            <div class="tooltip" id="tooltip" hidden></div>
          </div>
          <div class="key"><span><i class="dot"></i>결정적 수</span><span><i class="diamond"></i>예상 밖의 명수</span></div>
          <div id="here"></div>
        </div>
      </div>

      <div class="card" id="moments-card" hidden>
        <h3>주요 장면</h3>
        <div class="moments" id="moments"></div>
      </div>

      <div class="card">
        <a class="sub" id="download" href="#">SGF로 받기</a>
      </div>
    </aside>
  </section>
</main>

<script src="/board.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const pct = (p) => (p > 0 && p < 0.01 ? `${(p * 100).toPrecision(2)}%` : `${(p * 100).toFixed(0)}%`);

let game = null;      // 불러온 기보
let positions = [];   // 국면별 판 (0수 ~ 끝)
let turn = 0;
let analysis = null;  // 분석 결과 (done일 때)
let hoverPv = null;
let pollTimer = null;

// ---- 목록 ----

async function showList() {
  $("viewer").hidden = true;
  $("list-view").hidden = false;
  const items = await (await fetch("/api/library")).json();
  for (const kind of ["famous", "mine"]) {
    const box = $(kind);
    box.innerHTML = "";
    const list = items.filter((g) => g.kind === kind);
    if (!list.length) {
      box.innerHTML = kind === "famous"
        ? `<div class="empty">library 폴더에 SGF 기보를 넣으면 여기에 나타납니다.</div>`
        : `<div class="empty">끝까지 둔 대국이 아직 없습니다.</div>`;
    }
    for (const g of list) {
      const card = document.createElement("button");
      card.className = "game-card";
      card.innerHTML = `<div class="title"></div><div class="players"></div><div class="meta"></div>`;
      card.querySelector(".title").textContent = g.title;
      card.querySelector(".players").textContent = `흑 ${g.black} · 백 ${g.white}`;
      card.querySelector(".meta").textContent = [g.date, g.event, g.result, `${g.size}줄 ${g.moves}수`].filter(Boolean).join(" · ");
      card.addEventListener("click", () => { location.hash = g.id; });
      box.appendChild(card);
    }
  }
}

// ---- 재생: 따냄만 처리하는 간단한 규칙 (기보는 이미 둔 수라 합법성 검사는 생략) ----

function replay(size, moves) {
  let grid = Array.from({ length: size }, () => Array(size).fill("."));
  const out = [grid];
  const nbrs = (r, c) => [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < size && b < size);
  const groupLibs = (g, r, c) => {
    const color = g[r][c], seen = new Set([r * size + c]), stack = [[r, c]], stones = [];
    let libs = 0;
    while (stack.length) {
      const [a, b] = stack.pop();
      stones.push([a, b]);
      for (const [x, y] of nbrs(a, b)) {
        const k = x * size + y;
        if (seen.has(k)) continue;
        if (g[x][y] === ".") { libs++; seen.add(k); }
        else if (g[x][y] === color) { seen.add(k); stack.push([x, y]); }
      }
    }
    return [stones, libs];
  };
  for (const [color, v] of moves) {
    grid = grid.map((row) => row.slice());
    if (v !== "pass") {
      const [r, c] = pointOf(v);
      grid[r][c] = color;
      for (const [x, y] of nbrs(r, c)) {
        if (grid[x][y] !== "." && grid[x][y] !== color) {
          const [stones, libs] = groupLibs(grid, x, y);
          if (!libs) for (const [a, b] of stones) grid[a][b] = ".";
        }
      }
    }
    out.push(grid);
  }
  return out;
}

// ---- 감상 ----

async function openGame(id) {
  const res = await fetch(`/api/library/${encodeURIComponent(id)}`);
  if (!res.ok) { location.hash = ""; return; }
  game = await res.json();
  positions = replay(game.size, game.moves);
  turn = 0;
  analysis = null;
  const m = game.meta;
  $("g-title").textContent = m.GN || (m.EV && m.RO ? `${m.EV} 제${m.RO}국` : m.EV) || "기보";
  $("g-players").textContent = `흑 ${m.PB || "?"}${m.BR ? ` (${m.BR})` : ""} · 백 ${m.PW || "?"}${m.WR ? ` (${m.WR})` : ""}`;
  $("g-meta").textContent = [m.DT, m.PC, m.RE && `결과 ${m.RE}`, `덤 ${game.komi}`].filter(Boolean).join(" · ");
  $("g-warning").textContent = game.warning || "";
  $("slider").max = game.moves.length;
  $("download").href = `/api/library/${encodeURIComponent(id)}/sgf`;
  $("list-view").hidden = true;
  $("viewer").hidden = false;
  applyAnalysis(game.analysis);
  render();
}

function goTo(t) {
  turn = Math.max(0, Math.min(game.moves.length, t));
  hoverPv = null;
  render();
}

function render() {
  const t = turn;
  const lastMove = t > 0 && game.moves[t - 1][1] !== "pass" ? game.moves[t - 1][1] : null;
  const a = analysis && analysis.turns[t];
  const toPlay = t < game.moves.length ? game.moves[t][0] : (t > 0 && game.moves[t - 1][0] === "B" ? "W" : "B");
  const markers = [];
  if (a && a.best !== "pass" && t < game.moves.length) markers.push({ vertex: a.best, label: "AI", color: "var(--series)" });
  drawGoBoard($("board"), {
    size: game.size,
    grid: positions[t],
    lastMove,
    markers,
    preview: hoverPv ? { moves: hoverPv, firstColor: toPlay } : null,
  });

  $("slider").value = t;
  const total = game.moves.length;
  $("move-no").textContent = t === 0 ? `0 / ${total}` : `${t} / ${total} · ${game.moves[t - 1][0] === "B" ? "흑" : "백"} ${game.moves[t - 1][1]}`;
  $("first").disabled = $("prev").disabled = t === 0;
  $("next").disabled = $("last").disabled = t === total;
  const c = game.comments[t];
  $("comment").hidden = !c;
  $("comment").textContent = c || "";
  if (analysis) { renderChart(); renderHere(); }
}

// ---- 분석 ----

function applyAnalysis(a) {
  clearTimeout(pollTimer);
  $("analysis-start").hidden = a.state !== "none" && a.state !== "error" && a.state !== "busy";
  $("analysis-progress").hidden = a.state !== "running";
  $("analysis-body").hidden = a.state !== "done";
  if (a.state === "error" || a.state === "busy") $("analyze").textContent = `다시 시도 (${a.error})`;
  if (a.state === "running") {
    $("progress-text").textContent = `국면 ${a.done} / ${a.total} 분석 중`;
    $("progress-bar").style.width = `${(a.done / a.total) * 100}%`;
    pollTimer = setTimeout(poll, 1000);
  }
  if (a.state === "done") {
    analysis = a;
    renderMoments();
    render();
  }
}

async function poll() {
  if (!game) return;
  applyAnalysis(await (await fetch(`/api/library/${encodeURIComponent(game.id)}/analysis`)).json());
}

$("analyze").addEventListener("click", async () => {
  const res = await fetch(`/api/library/${encodeURIComponent(game.id)}/analyze`, { method: "POST", body: "{}" });
  applyAnalysis(await res.json());
});

function renderHere() {
  const t = turn;
  const a = analysis.turns[t];
  const box = $("here");
  if (!a) { box.innerHTML = ""; return; }
  const era = analysis.profile.replace("proyear_", "");
  const lead = a.score_black >= 0 ? `흑 ${a.score_black.toFixed(1)}집 우세` : `백 ${(-a.score_black).toFixed(1)}집 우세`;
  let html = `<div class="kv"><span>이 국면</span><b>흑 승률 ${pct(a.winrate_black)} · ${lead}</b></div>`;
  if (a.next) {
    const n = a.next;
    const who = n.color === "B" ? "흑" : "백";
    const engine = n.engine_rank ? `KataGo 후보 ${n.engine_rank}위` : "KataGo 후보 밖";
    const human = n.human_rank ? `${pct(n.human_p)} (${n.human_rank}위)` : pct(n.human_p);
    html += `<div class="reason"><b>다음 수 ${t + 1}. ${who} ${n.move}</b>
      <div class="kv"><span>엔진 평가</span><b>${engine} · 손실 ${n.loss.toFixed(1)}집 · 승률 −${pct(n.winrate_loss)}</b></div>
      <div class="kv"><span>${era}년 프로라면</span><b>이 수를 둘 확률 ${human}</b></div></div>`;
    if (a.best !== n.move && a.best !== "pass") {
      html += `<div class="pv" id="best-pv">KataGo 최선 ${a.best} (판에 AI 표시) · 예상 진행 ${a.best_pv.join(" → ")}</div>`;
    } else {
      html += `<div class="pv">실제 수가 KataGo 최선수와 같습니다.</div>`;
    }
  }
  box.innerHTML = html;
  const pv = $("best-pv");
  if (pv) {
    pv.addEventListener("mouseenter", () => { hoverPv = a.best_pv; render(); });
    pv.addEventListener("mouseleave", () => { hoverPv = null; render(); });
  }
}

function renderMoments() {
  const list = [
    ...analysis.turning_points.map((m) => ({ ...m, kind: "dot" })),
    ...analysis.surprises.map((m) => ({ ...m, kind: "diamond" })),
  ].sort((a, b) => a.turn - b.turn);
  $("moments-card").hidden = !list.length;
  const box = $("moments");
  box.innerHTML = "";
  for (const m of list) {
    const b = document.createElement("button");
    b.className = "moment";
    b.innerHTML = `<i class="${m.kind}"></i><span></span>`;
    b.querySelector("span").textContent = m.text;
    // 그 수를 두기 직전 국면으로 가서 AI 최선수와 비교해 볼 수 있게
    b.addEventListener("click", () => goTo(m.turn));
    box.appendChild(b);
  }
}

// 흑 승률 그래프: 한 계열 선(2px) + 50% 기준선 + 현재 위치 + 주요 장면 표식. 마우스로 십자선·툴팁, 클릭하면 이동
function renderChart() {
  const svg = $("chart");
  const W = svg.clientWidth || 340, H = 150, padL = 30, padR = 6, padT = 8, padB = 18;
  const turns = analysis.turns;
  const n = turns.length - 1 || 1;
  const x = (t) => padL + (t / n) * (W - padL - padR);
  const y = (p) => padT + (1 - p) * (H - padT - padB);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  for (const p of [0, 0.5, 1]) {
    svgEl("line", { x1: padL, x2: W - padR, y1: y(p), y2: y(p), stroke: "var(--line)", "stroke-width": 1, "stroke-dasharray": p === 0.5 ? "3 3" : "" }, svg);
    svgEl("text", { x: padL - 4, y: y(p), "font-size": 10, fill: "var(--muted)", "text-anchor": "end", "dominant-baseline": "central" }, svg).textContent = `${p * 100}%`;
  }
  svgEl("text", { x: W - padR, y: H - 4, "font-size": 10, fill: "var(--muted)", "text-anchor": "end" }, svg).textContent = `${n}수`;
  svgEl("text", { x: padL, y: H - 4, "font-size": 10, fill: "var(--muted)" }, svg).textContent = "흑 승률";
  const d = turns.map((t, i) => `${i ? "L" : "M"}${x(t.turn).toFixed(1)},${y(t.winrate_black).toFixed(1)}`).join("");
  svgEl("path", { d, fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  svgEl("line", { x1: x(turn), x2: x(turn), y1: padT, y2: H - padB, stroke: "var(--ink)", "stroke-width": 1, opacity: 0.5 }, svg);
  // 주요 장면: 그 수를 둔 뒤(turn+1)에 승률이 바뀌므로 그 지점에 표시. 8px, 배경색 테두리로 선과 분리
  for (const m of analysis.turning_points) {
    const t = turns[m.turn + 1];
    if (t) svgEl("circle", { cx: x(t.turn), cy: y(t.winrate_black), r: 4, fill: "var(--turning)", stroke: "var(--panel)", "stroke-width": 2 }, svg);
  }
  for (const m of analysis.surprises) {
    const t = turns[m.turn + 1];
    if (!t) continue;
    const cx = x(t.turn), cy = y(t.winrate_black);
    svgEl("rect", { x: cx - 4, y: cy - 4, width: 8, height: 8, fill: "var(--series)", stroke: "var(--panel)", "stroke-width": 2, transform: `rotate(45 ${cx} ${cy})` }, svg);
  }
  const cross = svgEl("line", { y1: padT, y2: H - padB, stroke: "var(--muted)", "stroke-width": 1, opacity: 0 }, svg);
  const tip = $("tooltip");
  const turnAt = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    return Math.max(0, Math.min(n, Math.round(((px - padL) / (W - padL - padR)) * n)));
  };
  svg.onmousemove = (ev) => {
    const t = turnAt(ev);
    const rect = svg.getBoundingClientRect();
    cross.setAttribute("x1", x(t)); cross.setAttribute("x2", x(t)); cross.setAttribute("opacity", 1);
    tip.hidden = false;
    tip.style.left = `${(x(t) / W) * rect.width}px`;
    tip.style.top = `${(y(turns[t].winrate_black) / H) * rect.height}px`;
    tip.textContent = `${t}수 · 흑 승률 ${pct(turns[t].winrate_black)}`;
  };
  svg.onmouseleave = () => { cross.setAttribute("opacity", 0); tip.hidden = true; };
  svg.onclick = (ev) => goTo(turnAt(ev));
}

// ---- 조작 ----

$("first").addEventListener("click", () => goTo(0));
$("prev").addEventListener("click", () => goTo(turn - 1));
$("next").addEventListener("click", () => goTo(turn + 1));
$("last").addEventListener("click", () => goTo(game.moves.length));
$("slider").addEventListener("input", (e) => goTo(+e.target.value));
document.addEventListener("keydown", (e) => {
  if (!game || $("viewer").hidden || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") goTo(turn - 1);
  else if (e.key === "ArrowRight") goTo(turn + 1);
  else if (e.key === "Home") goTo(0);
  else if (e.key === "End") goTo(game.moves.length);
  else return;
  e.preventDefault();
});
window.addEventListener("resize", () => { if (analysis && !$("viewer").hidden) renderChart(); });

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) openGame(id); else { game = null; showList(); }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
